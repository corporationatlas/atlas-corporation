<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas | Procura & Logística Automotriz Internacional</title>
    <meta name="description" content="Atlas - Logística y procura automotriz internacional. Importación bajo demanda desde Dubái y China hasta Venezuela." />
    <link rel="icon" type="image/png" href="/atlas-logo.png" />
    <script>
      window.addEventListener('error', function (e) {
        console.error('Error detectado:', e);
        var errBox = document.getElementById('debug-error-box');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'debug-error-box';
          errBox.style.cssText = 'position:fixed;bottom:10px;left:10px;right:10px;background:#7f1d1d;color:#fff;padding:16px;border-radius:12px;z-index:99999;font-family:monospace;font-size:12px;box-shadow:0 10px 25px rgba(0,0,0,0.5);border:1px solid #ef4444;';
          document.body.appendChild(errBox);
        }
        errBox.innerHTML = '<strong>Error de ejecución:</strong><br>' + e.message + '<br><small>' + (e.filename || '') + ':' + (e.lineno || '') + '</small>';
      });
    </script>
  </head>
  <body class="bg-[#090a0d] text-white antialiased">
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#090a0d;color:#94a3b8;font-family:system-ui,sans-serif;">
        <div style="text-align:center;">
          <div style="width:40px;height:40px;border:3px solid #334155;border-top-color:#fff;border-radius:50%;margin:0 auto 12px;animation:spin 0.8s linear infinite;"></div>
          <p style="font-size:14px;letter-spacing:0.1em;text-transform:uppercase;color:#cbd5e1;font-weight:bold;">Iniciando Atlas Platform...</p>
        </div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
